services:
    alarik:
        image: ghcr.io/achtungsoftware/alarik:latest
        container_name: alarik
        hostname: alarik
        restart: unless-stopped
        ports:
            - "9000:8080" # S3 API        
        environment:
            - API_BASE_URL=http://localhost:9000
            - CONSOLE_BASE_URL=http://localhost:3000
            - ADMIN_USERNAME=alarik
            - ADMIN_PASSWORD=alarik
            - JWT=vYc5ua8IP0eD6U5TEkkLkKjzPdI7fR77iFmDC5vnRpQ
            - ALLOW_ACCOUNT_CREATION=false
            - DEFAULT_BUCKETS=default
            # Chaves S3 fixas (usadas pelo Flink e pelo boto3 no desafio "Corrida de Dados").
            # Devem ser as mesmas definidas no docker-compose.yml do bigdata_docker.
            - ALARIK_REGION=${ALARIK_REGION:-us-east-1}
            - DEFAULT_ACCESS_KEY=${ALARIK_ACCESS_KEY:-ALARIKDESAFIO0000001}
            - DEFAULT_SECRET_KEY=${ALARIK_SECRET_KEY:-alarikdesafio-secret-key-0000000000000001}
        volumes:
            - alarik_data:/data
        networks:
            - default
            - bigdata_docker_network

    alarik-web-console:
        image: ghcr.io/achtungsoftware/alarik-console:latest
        container_name: alarik-web-console
        hostname: alarik-web-console
        restart: unless-stopped
        ports:
            - "3000:3000" # Web Console
        environment:
            - NUXT_PUBLIC_API_BASE_URL=http://localhost:9000
            - NUXT_PUBLIC_CONSOLE_BASE_URL=http://localhost:3000
            - NUXT_PUBLIC_ALLOW_ACCOUNT_CREATION=false
            - NUXT_API_BASE_URL=http://localhost:8080
        depends_on:
            - alarik

    # Expose alarik to the internet using Cloudflare Tunnel (with random address)
    #cloudflare-tunnel:
    #    image: cloudflare/cloudflared:latest
    #    restart: unless-stopped
    #    command: tunnel --url http://alarik-web-console:3000

volumes:
    alarik_data:

networks:
    bigdata_docker_network:
        external: true
        name: bigdata_docker_default